services:
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: quantumcart-api-gateway

    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: 8000

      # Downstream services (reachable on the shared external network)
      IDENTITY_SERVICE_URL: http://quantumcart-identity-service:8001
      PRODUCT_SERVICE_URL: http://quantumcart-product-service:8002
      CART_SERVICE_URL: http://quantumcart-cart-service:8003
      ORDER_SERVICE_URL: http://quantumcart-order-service:8004
      INVENTORY_SERVICE_URL: http://quantumcart-inventory-service:8005
      PAYMENT_SERVICE_URL: http://quantumcart-payment-service:8006
      CUSTOMER_SERVICE_URL: http://quantumcart-customer-service:8007

      # JWT verification (must match identity-service)
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: HS256

      # Proxy / HTTP
      PROXY_TIMEOUT_MS: ${PROXY_TIMEOUT_MS:-30000}
      BODY_LIMIT: ${BODY_LIMIT:-1mb}

      # CORS (comma separated). Defaults to the local storefront origin;
      # override for production. An empty list is only permissive outside
      # production, so it must not be left empty when NODE_ENV=production.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:4200}

      # Rate limiting
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-300}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-50}

      # Docs
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}

    ports:
      - "8000:8000"

    networks:
      - quantumcart-network

networks:
  quantumcart-network:
    external: true
