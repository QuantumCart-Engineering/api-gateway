name: API Gateway CI

on:
  push:
    branches:
      - dev
      - uat
      - master

  pull_request:
    branches:
      - dev
      - uat
      - master

# The gateway is a stateless edge proxy: it owns no database, queue or other
# backing service, so this job only needs read access to the repository.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      # Dummy, test-only value. The gateway tests build their configuration
      # in-memory (see src/__tests__/helpers/config.ts) and never reach real
      # downstream services or production resources.
      JWT_SECRET: ci-gateway-secret

    steps:

      # =========================
      # Checkout API Gateway
      # =========================
      - name: Checkout API Gateway
        uses: actions/checkout@v7

      # =========================
      # Setup Node.js
      # =========================
      # Node 24 is required: http-proxy-middleware@4 is ESM-only and Jest 30
      # can only require() ESM dependencies natively on Node >= 24.9. On Node 22
      # the integration suite fails to run with "Must use import to load ES
      # Module", while unit tests pass because they mock the proxy middleware.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # =========================
      # Install dependencies
      # =========================
      - name: Install dependencies
        run: npm ci

      # =========================
      # TypeScript check
      # =========================
      - name: TypeScript check
        run: npm run typecheck

      # =========================
      # Unit tests
      # =========================
      - name: Run unit tests
        run: npm run test:unit

      # =========================
      # Integration tests
      # =========================
      - name: Run integration tests
        run: npm run test:integration

      # =========================
      # Coverage
      # =========================
      - name: Run test coverage
        run: npm run test:coverage

      # =========================
      # Build API Gateway
      # =========================
      - name: Build API Gateway
        run: npm run build

      # =========================
      # Docker build
      # =========================
      - name: Build API Gateway Docker image
        run: docker build -t quantumcart-api-gateway:ci .
