name: API Gateway CI

on:
  push:
    branches:
      - dev
      - uat
      - master

  pull_request:
    branches:
      - dev
      - uat
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      JWT_SECRET: ci-gateway-secret

    steps:

      # =========================
      # Checkout API Gateway
      # =========================
      - name: Checkout API Gateway
        uses: actions/checkout@v4

      # =========================
      # Setup Node.js
      # =========================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # =========================
      # Install dependencies
      # =========================
      - name: Install dependencies
        run: npm ci

      # =========================
      # TypeScript check
      # =========================
      - name: TypeScript check
        run: npm run typecheck

      # =========================
      # Unit tests
      # =========================
      - name: Run unit tests
        run: npm run test:unit

      # =========================
      # Integration tests
      # =========================
      - name: Run integration tests
        run: npm run test:integration

      # =========================
      # Coverage
      # =========================
      - name: Run test coverage
        run: npm run test:coverage

      # =========================
      # Build API Gateway
      # =========================
      - name: Build API Gateway
        run: npm run build

      # =========================
      # Docker build
      # =========================
      - name: Build API Gateway Docker image
        run: docker build -t quantumcart-api-gateway:ci .
